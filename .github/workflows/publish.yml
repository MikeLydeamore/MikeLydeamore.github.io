on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"
  push:
    branches: [master]

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # HTML and the Typst CV PDF do not require a LaTeX installation.
          tinytex: false

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'

      - name: External dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          # libnode-dev selects the matching runtime for the runner's Ubuntu version.
          # Install the libraries declared by renv.lock before restoring R binaries:
          # V8; gsl/igraph; curl/openssl/xml2/stringi; systemfonts/textshaping/ragg;
          # and the libuv/zlib dependencies used by fs and haven.
          sudo apt-get install -y \
            libnode-dev \
            libgsl-dev libglpk-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
            libuv1-dev zlib1g-dev

      - name: Fix out-of-sync renv activate script
        run: |
          Rscript -e 'install.packages("renv"); renv::activate()'
        shell: bash


      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
